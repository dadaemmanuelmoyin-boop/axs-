<style>
:root{--bg:#04103a;--card:#0e1f66;--line:#1a2c78;--purple:#5a12f2;--blue:#0a63d6;--mute:#9fb0e6;--navy:#0b2d6b;--ok:#1fa36b;--bad:#d6334a}
*{box-sizing:border-box}html,body{margin:0}
body{background:#000;color:#fff;font:15px/1.4 Mulish,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px 0}
#app{width:393px;height:852px;background:var(--bg);position:relative;overflow-x:hidden;overflow-y:auto;border-radius:46px}
#app.w{background:#f5f5f5;padding-top:0}
@media (max-width:430px){body{display:block;padding:0}#app{width:100%;height:100vh;height:100dvh;border-radius:0}}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #7fb0ff;outline-offset:2px}
.top{display:flex;align-items:center;justify-content:center;position:relative;padding:calc(14px + env(safe-area-inset-top,0px)/.82) 16px 14px;text-align:center}
.top .l{position:absolute;left:12px;width:44px;height:44px;border-radius:50%;background:#101f66;font-size:28px;line-height:1;padding:0 0 4px}
.top .r{position:absolute;right:16px;width:30px;height:30px;border-radius:50%;background:var(--card);font-size:13px}
.top .r.ib{width:44px;height:44px;right:12px;font-size:22px}
.sub{font-size:12px;color:var(--mute)}.sub.ctr{font-size:14px}.ctr .mute{font-size:15px}
.mq{overflow:hidden;white-space:nowrap;font-size:14px;padding:0 0 12px}.mqt{display:inline-flex;animation:mq 16s linear infinite}.mqt span{padding-right:60px}@keyframes mq{to{transform:translateX(-50%)}}

function wiz(A){const st=S.step,f=S.f,e=S.err,P=(i,l)=>st==i?`<b class="sp">${i}. ${l}</b>`:`<b class="sc ${st>i?"done":""}">${i}</b>`,L=i=>`<u class="${i==st?"long":""}"></u>`;
 const full=()=>f.first.trim()&&f.last.trim()&&f.email.trim()&&f.email2.trim();
 let off=st==1?!S.sel.size:st==2?!full():false;
 let h=`<div class="lt"><div class="sh"><div class="wh"><button id="x" aria-label="${st==1?"Close":"Back"}">${st==1?"✕":"‹"}</button>${P(1,"Select")}${L(1)}${P(2,"Recipient")}${L(2)}${P(3,"Review")}</div>`+
 (st>1?`<div class="es"><img src="${TH}" alt=""><div><div class="et">${esc(EV.title)}</div><div class="ed">${esc(EV.date)}</div></div><div class="tkt">${S.sel.size}<i>➜</i></div></div>`:"")+`</div><div class="body">`;
 if(st==1){h+=`<h2>Select Seats to Transfer</h2><div class="card card1"><img class="big" src="${TH}" alt=""><div class="tr h0"><span></span><span>Sec</span><span>Row</span><span>Seat</span></div>`+
 act().map(t=>`<button class="tr ${S.sel.has(t.id)?"on":""}" data-id="${t.id}" role="checkbox" aria-checked="${S.sel.has(t.id)}"><span class="cb">${S.sel.has(t.id)?"✓":""}</span><span>${esc(t.name)}</span><span class="ad">${esc(t.cell)}</span></button>`).join("")+`</div>`}
 if(st==2){const R=(k,l,t="text")=>`<div class="fr"><label for="${k}">${l}</label><input id="${k}" type="${t}" value="${esc(f[k])}" placeholder="Required" autocomplete="off"></div>${e[k]?`<div class="err">${e[k]}</div>`:""}`;
 h+=`<h2>Add Recipient</h2><h4>Recent Recipients</h4><button class="sel" type="button">Select<i>⌄</i></button><div class="sec"><h4>Recipient</h4><button class="link" type="button">Add from Contacts</button></div><div class="fl">`+R("first","First Name")+R("last","Last Name")+R("email","Email","email")+R("email2","Confirm Email","email")+`</div><div class="sec" style="margin-bottom:0"><h4>Message to Recipient</h4></div><textarea id="note" maxlength="200" aria-label="Message to recipient">${esc(f.note)}</textarea>`}
 if(st==3){h+=`<h2>Review Your Transfer</h2><div class="sec" style="margin-top:34px"><h4>Tickets To Be Transferred</h4><button class="link" id="ed1">Edit</button></div><div class="card"><div class="tr rv h0"><span>Sec</span><span>Row</span><span>Seat</span></div>`+
 act().filter(t=>S.sel.has(t.id)).map(t=>`<div class="tr rv"><span>${esc(t.name)}</span><span class="ad">${esc(t.cell)}</span></div>`).join("")+`</div><div class="sec" style="margin-top:34px"><h4>Transfer Options</h4><button class="link" id="ed2">Edit</button></div><h4 style="font-size:18px">Recipient</h4><div class="rd">${esc(f.first)} ${esc(f.last)}<br>${esc(f.email)}${f.note?"<br>“"+esc(f.note)+"”":""}</div><h4 style="font-size:18px;margin-top:30px">Transfer Fee</h4><div class="rd">Free</div>`}
 h+=`</div><div class="foot"><button class="pill ${off?"off":""}" id="nx">${["Continue","Continue","Confirm Transfer"][st-1]}</button></div>`+
 (S.otp?`<div class="modal"><div><h3 style="margin:0 0 6px">Verify it’s you</h3><p style="margin:0 0 12px;color:#666;font-size:14px">Enter the 6-digit code sent to your phone. Demo code: 424242</p><input id="otp" inputmode="numeric" maxlength="6" aria-label="Verification code"><div class="err" style="margin-top:6px;padding:0">${S.otpErr}</div><div style="display:flex;gap:10px;margin-top:10px"><button class="pill" id="oc" style="background:#e6e8ef;color:#222;padding:12px">Cancel</button><button class="pill" id="ov" style="padding:12px">Verify</button></div></div></div>`:"")+`</div>`;
 A.innerHTML=h;A.scrollTop=0;
 $("#x").onclick=()=>st==1?go({scr:"tix"}):go({step:st-1});
 A.querySelectorAll(".tr[data-id]").forEach(b=>b.onclick=()=>{S.sel.has(b.dataset.id)?S.sel.delete(b.dataset.id):S.sel.add(b.dataset.id);render()});
 if(st==2){["first","last","email","email2","note"].forEach(k=>$("#"+k).oninput=ev=>{S.f[k]=ev.target.value;$("#nx").classList.toggle("off",!full())})}
 ["ed1","ed2"].forEach((i,n)=>{const b=$("#"+i);if(b)b.onclick=()=>go({step:n?2:1})});
 $("#nx").onclick=()=>{if(st==1&&!S.sel.size||st==2&&!full())return;if(st==1)go({step:2});else if(st==2){const E={},re=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!f.first.trim())E.first="Enter a first name.";if(!f.last.trim())E.last="Enter a last name.";
  if(!re.test(f.email))E.email="Enter a valid email address.";if(f.email2!==f.email)E.email2="Emails don’t match.";
  S.err=E;Object.keys(E).length?render():go({step:3,err:{}})}else go({otp:true,otpErr:""})};
 if(S.otp){const i=$("#otp");i.focus();$("#oc").onclick=()=>go({otp:false});
  const v=()=>{if(i.value=="424242"){const ids=[...S.sel];S.tk.forEach(t=>{if(ids.includes(t.id)){t.st="T";t.to=f.first+" "+f.last}});
   go({otp:false,scr:"done",sent:ids.length+" ticket"+(ids.length>1?"s":""),left:60})}else{S.otpErr="That code isn’t right. Try again.";$(".modal .err").textContent=S.otpErr}};
  $("#ov").onclick=v;i.oninput=()=>{if(i.value.length==6)v()}}}
render();
if(document.fonts)document.fonts.ready.then(()=>{if(S.scr=="tix"||S.scr=="list")render()});
addEventListener("resize",()=>{if(S.scr=="tix")render()});
</script></body></html>
